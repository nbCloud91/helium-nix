name: Update Helium

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      # Actions pinned by commit SHA, not tag: a moved tag can't change what runs.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31.11.3

      - name: Check for a new signed release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: nix run .#update

      - name: Build
        run: |
          git diff --quiet version.json && exit 0
          nix build .#helium --print-build-logs

      # Same job as the build: pushes made with GITHUB_TOKEN trigger no other workflow.
      - name: Commit
        run: |
          git diff --quiet version.json && { echo "No update."; exit 0; }
          v=$(jq -r .version version.json)
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "helium: $v"
          git push
